# Mantiene despierto el proyecto de Supabase de Lumina.
# Supabase pausa los proyectos gratis tras 7 días sin actividad;
# esto hace una consulta real a la base de datos todos los días.
# La anon key es pública por diseño (va dentro de la app).
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 * * *'   # todos los días, 6:17 a. m. Bogotá
  workflow_dispatch: {}      # botón "Run workflow" para probarlo a mano

permissions:
  actions: write             # para reactivarse solo (ver último paso)

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vgelzamhfcbdswgizgrp.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZnZWx6YW1oZmNiZHN3Z2l6Z3JwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcwMTIyNjgsImV4cCI6MjA5MjU4ODI2OH0.5H5xpslhmGlqcugAYUwytdK4uB3kdX3iT7UvmNxJYvQ
    steps:
      - name: Consulta a la base de datos
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "REST -> $code"; cat /tmp/out.txt; echo
          curl -s -o /dev/null -w 'Auth health -> %{http_code}\n' \
            "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
          # Falla (y GitHub te manda un correo) si Supabase no responde
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Evitar que GitHub apague este workflow por inactividad
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" || true
